name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.0). Must already exist."
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-amd64
            runner: windows-latest
            goos: windows
            goarch: amd64
            ext: .exe
            ldflags: "-H windowsgui -s -w"
          - name: linux-amd64
            runner: ubuntu-latest
            goos: linux
            goarch: amd64
            ext: ""
            ldflags: "-s -w"
          - name: linux-arm64
            runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            ext: ""
            ldflags: "-s -w"
          - name: darwin-amd64
            runner: macos-latest
            goos: darwin
            goarch: amd64
            ext: ""
            ldflags: "-s -w"
          - name: darwin-arm64
            runner: macos-latest
            goos: darwin
            goarch: arm64
            ext: ""
            ldflags: "-s -w"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux GUI deps (systray + dialog + RPM)
        if: matrix.goos == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libx11-dev \
            rpm

      - name: Install NSIS (Windows installer builder)
        if: matrix.goos == 'windows'
        shell: pwsh
        run: choco install nsis --yes --no-progress

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Build binary and package installers
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "1"
        run: |
          mkdir -p dist
          # macOS cross-compile: target the right arch explicitly so CGO links correctly.
          if [ "${{ matrix.goos }}" = "darwin" ]; then
            if [ "${{ matrix.goarch }}" = "amd64" ]; then
              export CGO_CFLAGS="-target x86_64-apple-macos11 -mmacosx-version-min=11.0"
              export CGO_LDFLAGS="-target x86_64-apple-macos11 -mmacosx-version-min=11.0"
            else
              export CGO_CFLAGS="-target arm64-apple-macos11 -mmacosx-version-min=11.0"
              export CGO_LDFLAGS="-target arm64-apple-macos11 -mmacosx-version-min=11.0"
            fi
          fi
          OUT="dist/shellhub-${{ matrix.name }}${{ matrix.ext }}"
          go build -trimpath -ldflags "${{ matrix.ldflags }}" -o "$OUT" .
          
          # Run native packaging scripts based on target OS
          if [ "${{ matrix.goos }}" = "darwin" ]; then
            chmod +x build/build-dmg.sh
            build/build-dmg.sh "$OUT" "${{ matrix.goarch }}"
            mv build/dist/*.dmg dist/
          elif [ "${{ matrix.goos }}" = "windows" ]; then
            # Add NSIS to PATH (choco installs it here on Windows runners)
            export PATH="$PATH:/c/Program Files (x86)/NSIS"
            # Copy binary into build/dist/ where shellhub.nsi expects it
            mkdir -p build/dist
            cp "$OUT" build/dist/shellhub-windows-amd64.exe
            cd build
            makensis shellhub.nsi
            cd ..
            # setup.exe is already written to build/dist/ by NSIS; copy to dist/
            cp build/dist/shellhub-windows-amd64-setup.exe dist/
          elif [ "${{ matrix.goos }}" = "linux" ]; then
            chmod +x build/build-deb.sh
            chmod +x build/build-rpm.sh
            build/build-deb.sh "$OUT" "${{ matrix.goarch }}"
            build/build-rpm.sh "$OUT" "${{ matrix.goarch }}"
            mv build/dist/*.deb dist/
            mv build/dist/*.rpm dist/
          fi
          
          ls -la dist

      - name: Compute SHA256
        shell: bash
        run: |
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum * > "SHA256SUMS-${{ matrix.name }}.txt"
          else
            shasum -a 256 * > "SHA256SUMS-${{ matrix.name }}.txt"
          fi
          cat "SHA256SUMS-${{ matrix.name }}.txt"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: shellhub-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten + combine checksums
        run: |
          mkdir -p release
          find artifacts -type f -name 'shellhub-*' ! -name 'SHA256SUMS-*' -exec cp {} release/ \;
          cat artifacts/**/SHA256SUMS-*.txt | sort > release/SHA256SUMS.txt
          ls -la release

      - name: Resolve tag name
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "name=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: ${{ steps.tag.outputs.name }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: release/*
