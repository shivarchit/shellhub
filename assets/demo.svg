<svg width="880" height="220" viewBox="0 0 880 220" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ShellHub startup demo">
  <style>
    .mono { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 14px; }
  </style>
  <rect width="880" height="220" rx="10" fill="#0b1120"/>
  <rect x="0.5" y="0.5" width="879" height="219" rx="9.5" fill="none" stroke="#1c2740"/>
  <!-- window chrome -->
  <rect width="880" height="34" rx="10" fill="#111827"/>
  <rect y="24" width="880" height="10" fill="#111827"/>
  <circle cx="20" cy="17" r="5.5" fill="#ff5f57"/>
  <circle cx="40" cy="17" r="5.5" fill="#febc2e"/>
  <circle cx="60" cy="17" r="5.5" fill="#28c840"/>
  <text x="84" y="21" class="mono" font-size="11" fill="#4f5d6e">shellhub — live demo</text>

  <!-- line 1: prompt + command (appears immediately) -->
  <g class="mono">
    <text x="24" y="72" fill="#22c55e">$<tspan fill="#e8edf5" dx="8">./shellhub</tspan></text>
  </g>

  <!-- line 2 -->
  <g class="mono" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.35s" begin="0.9s" fill="freeze"/>
    <text x="24" y="104" fill="#8b97a8">ShellHub v0.2.0 — serving on <tspan fill="#3b82f6">http://localhost:8080</tspan></text>
  </g>

  <!-- line 3 -->
  <g class="mono" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.35s" begin="1.8s" fill="freeze"/>
    <text x="24" y="132" fill="#8b97a8">database: <tspan fill="#e8edf5">~/ShellHub/shellhub.db</tspan> · 12 servers loaded · tray active</text>
  </g>

  <!-- line 4 -->
  <g class="mono" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.35s" begin="2.7s" fill="freeze"/>
    <text x="24" y="160" fill="#8b97a8">opening browser… <tspan fill="#22c55e">ready</tspan></text>
  </g>

  <!-- line 5: prompt + blinking cursor -->
  <g class="mono" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.35s" begin="3.5s" fill="freeze"/>
    <text x="24" y="192" fill="#22c55e">$</text>
    <rect x="40" y="181" width="9" height="15" fill="#22c55e">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1s" begin="3.9s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
