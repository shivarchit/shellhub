# ShellHub Server Configuration
# Copy this file to servers.yaml and fill in your real server details:
#   cp servers.example.yaml servers.yaml
#
# servers.yaml is gitignored (contains passwords).

servers:
  - name: "Production AEM"
    host: "10.0.1.50"
    port: 22
    username: "admin"
    password: "changeme"
    group: "Production"
    quick_commands:
      - name: "Flush Cache"
        command: "sudo /opt/aem/crx-quickstart/bin/flush-cache.sh"
        tag: "cache"
      - name: "Restart Apache"
        command: "sudo systemctl restart apache2"
        tag: "service"
      - name: "Restart AEM"
        command: "sudo systemctl restart aem"
        tag: "service"
      - name: "Clear htdocs"
        command: "cd /opt/apps/data/htdocs/ && pwd && rm -rf *"
        tag: "deploy"

  - name: "Staging Server"
    host: "10.0.2.10"
    port: 22
    username: "deploy"
    password: "changeme"
    group: "Staging"
    quick_commands:
      - name: "Deploy"
        command: "cd /opt/app && git pull && make deploy"
        tag: "deploy"
      - name: "View Logs"
        command: "tail -100 /var/log/app/app.log"
        tag: "logs"

  - name: "Dev Box"
    host: "192.168.1.100"
    port: 22
    username: "dev"
    password: "changeme"
    group: "Development"
    quick_commands:
      - name: "Check Disk Usage"
        command: "df -h"
        tag: "monitor"
